<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Language Selection</title>
  <link rel="stylesheet" href="css/common.css" />
</head>
<body>
  <div id="language-buttons">
    <button class="language-button lang-en" onclick="goToQnA('en')">English</button>
    <button class="language-button lang-zh" onclick="goToQnA('zh')">中文</button>
    <button class="language-button lang-ja" onclick="goToQnA('ja')">日本語</button>
    <button class="language-button lang-ko" onclick="goToQnA('ko')">한국어</button>
    <button class="language-button lang-ru" onclick="goToQnA('ru')">Русский</button>
    <button class="language-button lang-es" onclick="goToQnA('es')">Español</button>
    <button class="language-button lang-mn" onclick="goToQnA('mn')">Монгол</button>
    <button class="language-button lang-vi" onclick="goToQnA('vi')">Tiếng Việt</button>
    <button class="language-button lang-fr" onclick="goToQnA('fr')">Français</button>
    <button class="language-button lang-de" onclick="goToQnA('de')">Deutsch</button>
    <button class="language-button lang-ar" onclick="goToQnA('ar')">العربية</button>
    <button class="language-button lang-tr" onclick="goToQnA('tr')">Türkçe</button>
    <button class="language-button lang-si" onclick="goToQnA('si')">සිංහල</button>
    <button class="language-button lang-hi" onclick="goToQnA('hi')">हिन्दी</button>
    <button class="language-button lang-th" onclick="goToQnA('th')">ไทย</button>
    <button class="language-button lang-id" onclick="goToQnA('id')">Bahasa Indonesia</button>
  </div>

  <script>
    function goToQnA(lang) {
      // 지하객실 QR(?area=basement)나 이메일 링크(?nochat=1)로 들어온 경우,
      // 언어를 골라도 그 파라미터가 유지되도록 그대로 이어서 전달한다.
      const params = new URLSearchParams(window.location.search);
      const area = params.get('area');
      const nochat = params.get('nochat');
      const areaParam = area ? `&area=${area}` : '';
      const nochatParam = nochat ? `&nochat=${nochat}` : '';
      window.location.href = `QnA.html?lang=${lang}${areaParam}${nochatParam}`;
    }
  </script>
</body>
</html>
