<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Late Check-out</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/late_checkout.css" />
</head>

<!-- data-kiosk 없음: 여기는 손님 휴대폰(QR)이다. 키오스크와 달리 완료 후
     자동으로 첫 화면으로 넘어가지 않는다(js/late_checkout.js 참고). -->

<body>
  <header class="headline"></header>

  <main class="lc-page">
    <div id="lateCheckoutStage"></div>
    <div id="lcBack"></div>
  </main>

  <!-- ⚠️ 가상 키보드(osk.js)를 일부러 넣지 않는다. 키오스크는 물리 키보드가
       없어서 화면 키보드가 필요하지만, 손님 휴대폰에는 기본 키보드가 있다.
       화면 키보드를 띄우면 오히려 기본 키보드를 가로막는다.
       js/late_checkout.js는 openOSK가 없으면 알아서 건너뛴다. -->

  <!-- ⚠️ 예약 데이터를 내려받지 않는다. 이름을 서버에 보내면 서버가 그 손님
       한 건만 돌려준다. 그래서 이 페이지가 손님 휴대폰에서 열려도 전 투숙객
       명단이 노출되지 않는다. 여기에 예약 관련 스크립트를 추가하지 말 것. -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/late_checkout.js"></script>
</body>

</html>
