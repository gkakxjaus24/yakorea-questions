<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Q&A</title>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/QnA.css" />
</head>
<body>
  <header class="headline"></header>
  <div class="container" style="font-size: 20px">
    <!-- QnA 콘텐츠는 JS로 동적으로 로드 -->
  </div>
  <script src="js/common.js"></script>
  <script src="js/QnA.js"></script>
  <script>
    // 이메일로 전달되는 링크(?nochat=1)로 들어온 손님은 채팅을 쓸 수 없게
    // 위젯 스크립트 자체를 로드하지 않는다. 그 외(키오스크/방 QR코드)는 기존대로 정상 로드.
    if (new URLSearchParams(window.location.search).get('nochat') !== '1') {
      const s = document.createElement('script');
      // 로컬 테스트(?api=http://localhost:3001)일 때는 위젯도 그 서버에서 불러온다 — QnA.js의 FAQ_STATS_API와 같은 규칙.
      s.src = FAQ_STATS_API + '/widget/chat-widget.js';
      s.dataset.mode = 'guest-qr';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
